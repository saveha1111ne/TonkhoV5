<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HỆ THỐNG QUẢN LÝ HÀNG TỒN KHO TEAM CIC - Made by Ha Nhung logistic</title>
  <meta name="description" content="Hệ thống quản lý hàng tồn kho chuyên nghiệp cho Team CIC - Hotline: 0901601600" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #F5FBFA;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #E0F2F1; }
    ::-webkit-scrollbar-thumb { background: #80CBC4; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00897B; }
    .gradient-header {
      background: linear-gradient(135deg, #00695C 0%, #00897B 35%, #29B6F6 100%);
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_BRANCHES = [
      { id: 'b-hn', code: 'HN', name: 'Hà Nội', region: 'Miền Bắc' },
      { id: 'b-dn', code: 'DN', name: 'Đà Nẵng', region: 'Miền Trung' },
      { id: 'b-hcm', code: 'HCM', name: 'HCM', region: 'Miền Nam' },
      { id: 'b-ct', code: 'CT', name: 'Cần Thơ', region: 'Tây Nam Bộ' }
    ];

    const DEFAULT_ITEMS = [
      { id: 'it-1', code: 'TDC-CIC01', name: 'Túi đeo chéo Team CIC Premium', unit: 'Cái', category: 'Túi đeo chéo', status: 'active', minStockAlert: 50 },
      { id: 'it-2', code: 'DU-CIC02', name: 'Dù gập tự động Team CIC chống UV', unit: 'Chiếc', category: 'Dù', status: 'active', minStockAlert: 40 },
      { id: 'it-3', code: 'BGN-CIC03', name: 'Bình giữ nhiệt Lock&Lock CIC Inox 500ml', unit: 'Chiếc', category: 'Bình giữ nhiệt', status: 'active', minStockAlert: 30 },
      { id: 'it-4', code: 'AT-CIC04', name: 'Áo thun Polo đồng phục Team CIC', unit: 'Áo', category: 'Đồng phục', status: 'active', minStockAlert: 60 },
      { id: 'it-5', code: 'ST-CIC05', name: 'Sổ tay bìa da còng logo CIC', unit: 'Cuốn', category: 'Quà tặng', status: 'active', minStockAlert: 25 },
      { id: 'it-6', code: 'BALO-CIC06', name: 'Balo laptop cao cấp CIC Pro', unit: 'Cái', category: 'Túi đeo chéo', status: 'active', minStockAlert: 20 }
    ];

    const DEFAULT_MONTHS = ['T06/2026', 'T07/2026', 'T08/2026'];

    const BASELINE_STOCK_T06 = {
      'TDC-CIC01': { 'b-hn': 120, 'b-dn': 80, 'b-hcm': 150, 'b-ct': 60 },
      'DU-CIC02': { 'b-hn': 90, 'b-dn': 60, 'b-hcm': 110, 'b-ct': 45 },
      'BGN-CIC03': { 'b-hn': 100, 'b-dn': 50, 'b-hcm': 130, 'b-ct': 40 },
      'AT-CIC04': { 'b-hn': 200, 'b-dn': 120, 'b-hcm': 250, 'b-ct': 90 },
      'ST-CIC05': { 'b-hn': 80, 'b-dn': 40, 'b-hcm': 95, 'b-ct': 30 },
      'BALO-CIC06': { 'b-hn': 65, 'b-dn': 35, 'b-hcm': 85, 'b-ct': 25 }
    };

    const DEFAULT_TRANSACTIONS = [
      { id: 'tx-1', code: 'NK-260701', type: 'IN', month: 'T07/2026', date: '2026-07-02', branchId: 'b-hn', branchName: 'Hà Nội', itemCode: 'TDC-CIC01', itemName: 'Túi đeo chéo Team CIC Premium', unit: 'Cái', quantity: 100, receiverOrDeliverer: 'Kho vận Hà Nhung', notes: 'Nhập đầu tháng' },
      { id: 'tx-2', code: 'XK-260701', type: 'OUT', month: 'T07/2026', date: '2026-07-15', branchId: 'b-hn', branchName: 'Hà Nội', itemCode: 'TDC-CIC01', itemName: 'Túi đeo chéo Team CIC Premium', unit: 'Cái', quantity: 60, receiverOrDeliverer: 'Kinh Doanh HN', notes: 'Sự kiện quý 3' },
      { id: 'tx-3', code: 'NK-260702', type: 'IN', month: 'T07/2026', date: '2026-07-06', branchId: 'b-hcm', branchName: 'HCM', itemCode: 'DU-CIC02', itemName: 'Dù gập tự động Team CIC chống UV', unit: 'Chiếc', quantity: 70, receiverOrDeliverer: 'Xưởng Dù Sài Gòn', notes: 'Lô mùa mưa' },
      { id: 'tx-4', code: 'XK-260702', type: 'OUT', month: 'T07/2026', date: '2026-07-22', branchId: 'b-hcm', branchName: 'HCM', itemCode: 'DU-CIC02', itemName: 'Dù gập tự động Team CIC chống UV', unit: 'Chiếc', quantity: 50, receiverOrDeliverer: 'Đại lý miền Nam', notes: 'Xuất đại lý' },
      { id: 'tx-5', code: 'NK-260801', type: 'IN', month: 'T08/2026', date: '2026-08-03', branchId: 'b-hcm', branchName: 'HCM', itemCode: 'TDC-CIC01', itemName: 'Túi đeo chéo Team CIC Premium', unit: 'Cái', quantity: 120, receiverOrDeliverer: 'Xưởng may Hà Nhung', notes: 'Lô thu' },
      { id: 'tx-6', code: 'XK-260801', type: 'OUT', month: 'T08/2026', date: '2026-08-14', branchId: 'b-hcm', branchName: 'HCM', itemCode: 'TDC-CIC01', itemName: 'Túi đeo chéo Team CIC Premium', unit: 'Cái', quantity: 75, receiverOrDeliverer: 'Chi nhánh SG', notes: 'Phân phối' }
    ];

    function App() {
      const [branches, setBranches] = useState(() => {
        const s = localStorage.getItem('cic_html_branches');
        return s ? JSON.parse(s) : DEFAULT_BRANCHES;
      });
      const [items, setItems] = useState(() => {
        const s = localStorage.getItem('cic_html_items');
        return s ? JSON.parse(s) : DEFAULT_ITEMS;
      });
      const [months, setMonths] = useState(() => {
        const s = localStorage.getItem('cic_html_months');
        return s ? JSON.parse(s) : DEFAULT_MONTHS;
      });
      const [transactions, setTransactions] = useState(() => {
        const s = localStorage.getItem('cic_html_transactions');
        return s ? JSON.parse(s) : DEFAULT_TRANSACTIONS;
      });
      const [baseline, setBaseline] = useState(() => {
        const s = localStorage.getItem('cic_html_baseline');
        return s ? JSON.parse(s) : BASELINE_STOCK_T06;
      });

      const [selectedMonth, setSelectedMonth] = useState('T08/2026');
      const [selectedBranch, setSelectedBranch] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [toast, setToast] = useState(null);

      const [showInboundModal, setShowInboundModal] = useState(false);
      const [showOutboundModal, setShowOutboundModal] = useState(false);
      const [showItemModal, setShowItemModal] = useState(false);

      useEffect(() => {
        localStorage.setItem('cic_html_branches', JSON.stringify(branches));
        localStorage.setItem('cic_html_items', JSON.stringify(items));
        localStorage.setItem('cic_html_months', JSON.stringify(months));
        localStorage.setItem('cic_html_transactions', JSON.stringify(transactions));
        localStorage.setItem('cic_html_baseline', JSON.stringify(baseline));
      }, [branches, items, months, transactions, baseline]);

      const showNotice = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const stockRecords = useMemo(() => {
        const sortedMonths = [...months].sort((a, b) => {
          const mA = parseInt(a.replace(/\D/g, '').slice(0, 2) || '0', 10);
          const yA = parseInt(a.replace(/\D/g, '').slice(2) || '0', 10);
          const mB = parseInt(b.replace(/\D/g, '').slice(0, 2) || '0', 10);
          const yB = parseInt(b.replace(/\D/g, '').slice(2) || '0', 10);
          return (yA * 100 + mA) - (yB * 100 + mB);
        });

        const result = {};
        const currentRunning = {};

        items.forEach(it => {
          branches.forEach(br => {
            const key = it.code + '_' + br.id;
            currentRunning[key] = baseline[it.code]?.[br.id] || 0;
          });
        });

        sortedMonths.forEach((m, mIdx) => {
          const mRecs = [];
          const inMap = {};
          const outMap = {};

          transactions.filter(t => t.month === m).forEach(t => {
            const k = t.itemCode + '_' + t.branchId;
            if (t.type === 'IN') inMap[k] = (inMap[k] || 0) + Number(t.quantity || 0);
            if (t.type === 'OUT') outMap[k] = (outMap[k] || 0) + Number(t.quantity || 0);
          });

          items.forEach(it => {
            branches.forEach(br => {
              const k = it.code + '_' + br.id;
              const init = mIdx === 0 ? (baseline[it.code]?.[br.id] || 0) : (currentRunning[k] || 0);
              const inQ = inMap[k] || 0;
              const outQ = outMap[k] || 0;
              const fin = init + inQ - outQ;
              currentRunning[k] = fin;
              mRecs.push({
                month: m,
                itemCode: it.code,
                branchId: br.id,
                initialStock: init,
                inQty: inQ,
                outQty: outQ,
                finalStock: fin
              });
            });
          });
          result[m] = mRecs;
        });
        return result;
      }, [months, items, branches, transactions, baseline]);

      const currentMonthRecs = stockRecords[selectedMonth] || [];
      const currentMonthTxs = transactions.filter(t => t.month === selectedMonth);
      const totalIn = currentMonthTxs.filter(t => t.type === 'IN').reduce((s, t) => s + Number(t.quantity || 0), 0);
      const totalOut = currentMonthTxs.filter(t => t.type === 'OUT').reduce((s, t) => s + Number(t.quantity || 0), 0);
      const totalFinal = currentMonthRecs.reduce((s, r) => s + r.finalStock, 0);

      const handleExportExcel = () => {
        if (typeof XLSX === 'undefined') return alert('Đang tải SheetJS, vui lòng thử lại');
        const wb = XLSX.utils.book_new();
        const rows = [
          ['Mã VT', 'Tên vật tư', 'Chi nhánh', 'Tồn đầu', 'Nhập', 'Xuất', 'Tồn cuối']
        ];
        const itemMap = new Map(items.map(i => [i.code, i.name]));
        const branchMap = new Map(branches.map(b => [b.id, b.name]));
        currentMonthRecs.forEach(r => {
          rows.push([
            r.itemCode,
            itemMap.get(r.itemCode) || r.itemCode,
            branchMap.get(r.branchId) || r.branchId,
            r.initialStock,
            r.inQty,
            r.outQty,
            r.finalStock
          ]);
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Ton_Kho_CIC');
        XLSX.writeFile(wb, 'Bao_Cao_Ton_Kho_CIC_' + selectedMonth.replace('/', '_') + '.xlsx');
        showNotice('✓ Đã xuất file Excel!');
      };

      const handleAddNextMonth = () => {
        const last = months[months.length - 1] || 'T08/2026';
        const match = last.match(/T?(\\d{1,2})\\/(\\d{4})/);
        let m = match ? parseInt(match[1], 10) + 1 : 9;
        let y = match ? parseInt(match[2], 10) : 2026;
        if (m > 12) { m = 1; y += 1; }
        const nextMonth = 'T' + String(m).padStart(2, '0') + '/' + y;
        if (months.includes(nextMonth)) return alert('Tháng đã tồn tại!');
        setMonths([...months, nextMonth]);
        setSelectedMonth(nextMonth);
        showNotice('✓ Đã thêm ' + nextMonth + ' và chuyển tồn đầu kỳ!');
      };

      return (
        <div class="min-h-screen flex flex-col">
          <header class="gradient-header text-white shadow-lg sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur flex items-center justify-center font-black text-xl">
                  📦
                </div>
                <div>
                  <h1 class="font-extrabold text-lg tracking-wide uppercase">
                    HỆ THỐNG QUẢN LÝ HÀNG TỒN KHO TEAM CIC
                  </h1>
                  <p class="text-xs text-sky-100 font-medium">Inventory Management Dashboard</p>
                </div>
              </div>
              <div class="text-right text-xs">
                <span class="bg-white/20 px-3 py-1 rounded-full font-semibold border border-white/30">
                  Made by Ha Nhung logistic
                </span>
                <p class="mt-1 text-sky-100 font-bold">Hotline: 0901601600</p>
              </div>
            </div>
          </header>

          <div class="bg-white border-b border-teal-100 shadow-sm sticky top-[62px] z-30">
            <div class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2 overflow-x-auto">
                <button onClick={() => setShowInboundModal(true)} class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm">
                  ⬆️ NHẬP KHO
                </button>
                <button onClick={() => setShowOutboundModal(true)} class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-sm">
                  ⬇️ XUẤT KHO
                </button>
                <button onClick={() => setShowItemModal(true)} class="px-3 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold shadow-sm">
                  ➕ THÊM VẬT TƯ
                </button>
                <button onClick={handleAddNextMonth} class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm">
                  📅 THÊM THÁNG MỚI
                </button>
              </div>
              <div class="flex items-center gap-2">
                <button onClick={handleExportExcel} class="px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-300 text-xs font-bold">
                  📥 XUẤT EXCEL
                </button>
              </div>
            </div>
          </div>

          {toast && (
            <div class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl bg-teal-800 text-white text-xs font-bold shadow-2xl">
              {toast.msg}
            </div>
          )}

          <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
              <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl">
                <p class="text-xs font-bold text-emerald-700 uppercase">TỔNG NHẬP ({selectedMonth})</p>
                <p class="text-2xl font-black text-emerald-900 mt-1">{totalIn.toLocaleString()}</p>
              </div>
              <div class="bg-sky-50 border border-sky-200 p-4 rounded-2xl">
                <p class="text-xs font-bold text-sky-700 uppercase">TỔNG XUẤT ({selectedMonth})</p>
                <p class="text-2xl font-black text-sky-900 mt-1">{totalOut.toLocaleString()}</p>
              </div>
              <div class="bg-teal-50 border border-teal-200 p-4 rounded-2xl">
                <p class="text-xs font-bold text-teal-800 uppercase">TỔNG TỒN HIỆN CÓ</p>
                <p class="text-2xl font-black text-teal-900 mt-1">{totalFinal.toLocaleString()}</p>
              </div>
              <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl">
                <p class="text-xs font-bold text-amber-700 uppercase">SỐ CHI NHÁNH</p>
                <p class="text-2xl font-black text-amber-900 mt-1">{branches.length}</p>
              </div>
              <div class="bg-purple-50 border border-purple-200 p-4 rounded-2xl col-span-2 md:col-span-1">
                <p class="text-xs font-bold text-purple-700 uppercase">SỐ MÃ VẬT TƯ</p>
                <p class="text-2xl font-black text-purple-900 mt-1">{items.length}</p>
              </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-teal-100 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-slate-600">Tháng:</span>
                  <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} class="bg-sky-50 border border-sky-300 rounded-lg text-xs font-bold px-3 py-1.5">
                    {months.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-slate-600">Chi nhánh:</span>
                  <select value={selectedBranch} onChange={e => setSelectedBranch(e.target.value)} class="border rounded-lg text-xs font-semibold px-3 py-1.5">
                    <option value="all">Tất cả chi nhánh</option>
                    {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                  </select>
                </div>
              </div>
              <input
                type="text"
                placeholder="🔍 Tìm mã hoặc tên..."
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}
                class="border rounded-lg px-3 py-1.5 text-xs w-full sm:w-64"
              />
            </div>

            <div class="bg-white rounded-2xl border border-teal-100 overflow-hidden shadow-sm">
              <div class="px-5 py-4 border-b border-teal-50">
                <h2 class="font-bold text-slate-800 text-sm">
                  BẢNG NHẬP - XUẤT - TỒN THEO VẬT TƯ VÀ CHI NHÁNH ({selectedMonth})
                </h2>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-xs text-left">
                  <thead class="bg-teal-50/70 font-bold border-b border-teal-100 text-slate-700">
                    <tr>
                      <th class="py-3 px-4">MÃ VT</th>
                      <th class="py-3 px-4">TÊN VẬT TƯ</th>
                      <th class="py-3 px-3">ĐVT</th>
                      <th class="py-3 px-3">CHI NHÁNH</th>
                      <th class="py-3 px-3 text-right">TỒN ĐẦU</th>
                      <th class="py-3 px-3 text-right text-emerald-700">NHẬP</th>
                      <th class="py-3 px-3 text-right text-sky-700">XUẤT</th>
                      <th class="py-3 px-4 text-right text-teal-900 font-black">TỒN CUỐI</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    {currentMonthRecs
                      .filter(r => selectedBranch === 'all' || r.branchId === selectedBranch)
                      .filter(r => {
                        if (!searchTerm) return true;
                        const it = items.find(i => i.code === r.itemCode);
                        return (r.itemCode + ' ' + (it ? it.name : '')).toLowerCase().includes(searchTerm.toLowerCase());
                      })
                      .map((r, idx) => {
                        const it = items.find(i => i.code === r.itemCode);
                        const br = branches.find(b => b.id === r.branchId);
                        return (
                          <tr key={idx} class="hover:bg-teal-50/30">
                            <td class="py-2.5 px-4 font-mono font-bold text-teal-800">{r.itemCode}</td>
                            <td class="py-2.5 px-4">{it ? it.name : r.itemCode}</td>
                            <td class="py-2.5 px-3 text-slate-500">{it ? it.unit : ''}</td>
                            <td class="py-2.5 px-3 font-semibold">{br ? br.name : r.branchId}</td>
                            <td class="py-2.5 px-3 text-right">{r.initialStock.toLocaleString()}</td>
                            <td class="py-2.5 px-3 text-right font-bold text-emerald-600">+{r.inQty.toLocaleString()}</td>
                            <td class="py-2.5 px-3 text-right font-bold text-sky-600">-{r.outQty.toLocaleString()}</td>
                            <td class="py-2.5 px-4 text-right font-black text-teal-900 bg-teal-50/30">{r.finalStock.toLocaleString()}</td>
                          </tr>
                        );
                      })}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Inbound Form */}
            {showInboundModal && (
              <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-3 text-xs">
                  <div class="flex justify-between items-center font-bold text-sm text-emerald-800">
                    <span>⬆️ NHẬP KHO</span>
                    <button onClick={() => setShowInboundModal(false)}>✕</button>
                  </div>
                  <form onSubmit={e => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    const it = items.find(i => i.code === fd.get('itemCode'));
                    const br = branches.find(b => b.id === fd.get('branchId'));
                    const newTx = {
                      id: 'tx-' + Date.now(),
                      code: 'NK-' + Date.now().toString().slice(-6),
                      type: 'IN',
                      month: fd.get('month'),
                      date: fd.get('date'),
                      branchId: br.id,
                      branchName: br.name,
                      itemCode: it.code,
                      itemName: it.name,
                      unit: it.unit,
                      quantity: Number(fd.get('quantity')),
                      receiverOrDeliverer: fd.get('person'),
                      notes: fd.get('notes')
                    };
                    setTransactions([...transactions, newTx]);
                    setShowInboundModal(false);
                    showNotice('✓ Đã thêm nhập kho!');
                  }} class="space-y-2">
                    <label class="block font-semibold">Tháng:
                      <select name="month" defaultValue={selectedMonth} class="w-full border p-2 rounded mt-1">
                        {months.map(m => <option key={m} value={m}>{m}</option>)}
                      </select>
                    </label>
                    <label class="block font-semibold">Ngày:
                      <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} required class="w-full border p-2 rounded mt-1" />
                    </label>
                    <label class="block font-semibold">Chi nhánh:
                      <select name="branchId" class="w-full border p-2 rounded mt-1">
                        {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                      </select>
                    </label>
                    <label class="block font-semibold">Vật tư:
                      <select name="itemCode" class="w-full border p-2 rounded mt-1">
                        {items.map(i => <option key={i.code} value={i.code}>{i.code} - {i.name}</option>)}
                      </select>
                    </label>
                    <label class="block font-semibold">Số lượng:
                      <input name="quantity" type="number" min="1" required class="w-full border p-2 rounded mt-1 font-bold text-emerald-800" />
                    </label>
                    <label class="block font-semibold">Người giao:
                      <input name="person" class="w-full border p-2 rounded mt-1" />
                    </label>
                    <label class="block font-semibold">Ghi chú:
                      <input name="notes" class="w-full border p-2 rounded mt-1" />
                    </label>
                    <div class="flex gap-2 pt-2">
                      <button type="button" onClick={() => setShowInboundModal(false)} class="flex-1 py-2 bg-slate-100 font-bold rounded">Hủy</button>
                      <button type="submit" class="flex-1 py-2 bg-emerald-600 text-white font-bold rounded">Lưu Nhập Kho</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Outbound Form */}
            {showOutboundModal && (
              <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-3 text-xs">
                  <div class="flex justify-between items-center font-bold text-sm text-sky-800">
                    <span>⬇️ XUẤT KHO</span>
                    <button onClick={() => setShowOutboundModal(false)}>✕</button>
                  </div>
                  <form onSubmit={e => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    const it = items.find(i => i.code === fd.get('itemCode'));
                    const br = branches.find(b => b.id === fd.get('branchId'));
                    const qty = Number(fd.get('quantity'));
                    const month = fd.get('month');

                    const cur = (stockRecords[month] || []).find(r => r.itemCode === it.code && r.branchId === br.id);
                    const av = cur ? cur.finalStock : 0;
                    if (qty > av) {
                      if (!confirm('⚠️ Cảnh báo: Số lượng xuất (' + qty + ') lớn hơn tồn (' + av + '). Tiếp tục?')) return;
                    }

                    const newTx = {
                      id: 'tx-' + Date.now(),
                      code: 'XK-' + Date.now().toString().slice(-6),
                      type: 'OUT',
                      month,
                      date: fd.get('date'),
                      branchId: br.id,
                      branchName: br.name,
                      itemCode: it.code,
                      itemName: it.name,
                      unit: it.unit,
                      quantity: qty,
                      receiverOrDeliverer: fd.get('person'),
                      notes: fd.get('notes')
                    };
                    setTransactions([...transactions, newTx]);
                    setShowOutboundModal(false);
                    showNotice('✓ Đã thêm xuất kho!');
                  }} class="space-y-2">
                    <label class="block font-semibold">Tháng:
                      <select name="month" defaultValue={selectedMonth} class="w-full border p-2 rounded mt-1">
                        {months.map(m => <option key={m} value={m}>{m}</option>)}
                      </select>
                    </label>
                    <label class="block font-semibold">Ngày:
                      <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} required class="w-full border p-2 rounded mt-1" />
                    </label>
                    <label class="block font-semibold">Chi nhánh:
                      <select name="branchId" class="w-full border p-2 rounded mt-1">
                        {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                      </select>
                    </label>
                    <label class="block font-semibold">Vật tư:
                      <select name="itemCode" class="w-full border p-2 rounded mt-1">
                        {items.map(i => <option key={i.code} value={i.code}>{i.code} - {i.name}</option>)}
                      </select>
                    </label>
                    <label class="block font-semibold">Số lượng:
                      <input name="quantity" type="number" min="1" required class="w-full border p-2 rounded mt-1 font-bold text-sky-800" />
                    </label>
                    <label class="block font-semibold">Người nhận:
                      <input name="person" class="w-full border p-2 rounded mt-1" />
                    </label>
                    <label class="block font-semibold">Ghi chú:
                      <input name="notes" class="w-full border p-2 rounded mt-1" />
                    </label>
                    <div class="flex gap-2 pt-2">
                      <button type="button" onClick={() => setShowOutboundModal(false)} class="flex-1 py-2 bg-slate-100 font-bold rounded">Hủy</button>
                      <button type="submit" class="flex-1 py-2 bg-sky-600 text-white font-bold rounded">Lưu Xuất Kho</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Item Modal */}
            {showItemModal && (
              <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-3 text-xs">
                  <div class="flex justify-between items-center font-bold text-sm text-teal-800">
                    <span>➕ THÊM VẬT TƯ MỚI</span>
                    <button onClick={() => setShowItemModal(false)}>✕</button>
                  </div>
                  <form onSubmit={e => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    const code = String(fd.get('code')).trim().toUpperCase();
                    if (items.some(i => i.code === code)) return alert('Mã SKU đã tồn tại!');
                    const newItem = {
                      id: 'it-' + Date.now(),
                      code,
                      name: String(fd.get('name')).trim(),
                      unit: String(fd.get('unit')).trim(),
                      category: String(fd.get('category')).trim(),
                      status: 'active',
                      minStockAlert: 20
                    };
                    setItems([...items, newItem]);
                    setShowItemModal(false);
                    showNotice('✓ Đã thêm vật tư ' + code);
                  }} class="space-y-2">
                    <label class="block font-semibold">Mã SKU:
                      <input name="code" required placeholder="TDC-CIC07" class="w-full border p-2 rounded mt-1 font-mono uppercase" />
                    </label>
                    <label class="block font-semibold">Tên vật tư:
                      <input name="name" required placeholder="Tên sản phẩm..." class="w-full border p-2 rounded mt-1" />
                    </label>
                    <label class="block font-semibold">Đơn vị:
                      <input name="unit" defaultValue="Cái" required class="w-full border p-2 rounded mt-1" />
                    </label>
                    <label class="block font-semibold">Nhóm vật tư:
                      <input name="category" defaultValue="Túi đeo chéo" class="w-full border p-2 rounded mt-1" />
                    </label>
                    <div class="flex gap-2 pt-2">
                      <button type="button" onClick={() => setShowItemModal(false)} class="flex-1 py-2 bg-slate-100 font-bold rounded">Hủy</button>
                      <button type="submit" class="flex-1 py-2 bg-teal-600 text-white font-bold rounded">Thêm</button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </main>

          <footer class="bg-white border-t border-teal-100 py-3 text-center text-xs text-slate-500">
            <p class="font-bold text-teal-800">Version Made by Ha Nhung logistic | Hotline: 0901601600</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
