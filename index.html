<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HỆ THỐNG QUẢN LÝ HÀNG TỒN KHO TEAM CIC - Made by Ha Nhung logistic</title>
    <meta name="description" content="Hệ thống quản lý hàng tồn kho chuyên nghiệp cho Team CIC với đầy đủ nhập, xuất, tồn, chuyển tháng, đồng bộ Google Sheets và báo cáo đa chi nhánh. Made by Ha Nhung logistic - Hotline: 0901601600." />
    <meta property="og:title" content="HỆ THỐNG QUẢN LÝ HÀNG TỒN KHO TEAM CIC" />
    <meta property="og:description" content="Quản lý Nhập - Xuất - Tồn theo từng chi nhánh, mã vật tư và tháng. Made by Ha Nhung logistic | Hotline: 0901601600" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5FBFA] text-slate-800 antialiased font-sans min-h-screen">
<script>
  (function() {
    // Nếu chưa mở khóa thì ẩn các nút chỉnh sửa
    if (localStorage.getItem("admin_unlocked") !== "true") {
      window.addEventListener('DOMContentLoaded', function() {
        function lockActionButtons() {
          var buttons = document.querySelectorAll('button');
          buttons.forEach(function(btn) {
            var text = btn.innerText.toLowerCase();
            if (text.includes('thêm') || text.includes('sửa') || text.includes('xóa') || text.includes('lưu') || text.includes('tạo') || text.includes('nhập') || text.includes('xuất')) {
              btn.style.opacity = "0.4";
              btn.style.pointerEvents = "none";
              btn.title = "Chức năng này yêu cầu quyền quản trị!";
            }
          });
        }
        lockActionButtons();
        setTimeout(lockActionButtons, 1000);
      });
    }

    // Tự động tạo nút Mở khóa ở góc màn hình cho chị
    window.addEventListener('DOMContentLoaded', function() {
      if (localStorage.getItem("admin_unlocked") !== "true") {
        var unlockBtn = document.createElement('button');
        unlockBtn.innerHTML = "🔓 Mở khóa Quản trị";
        unlockBtn.style.position = "fixed";
        unlockBtn.style.bottom = "10px";
        unlockBtn.style.right = "10px";
        unlockBtn.style.zIndex = "9999";
        unlockBtn.style.padding = "8px 12px";
        unlockBtn.style.background = "#0f172a";
        unlockBtn.style.color = "#fff";
        unlockBtn.style.border = "none";
        unlockBtn.style.borderRadius = "6px";
        unlockBtn.style.cursor = "pointer";
        unlockBtn.style.boxShadow = "0 4px 6px rgba(0,0,0,0.1)";
        
        unlockBtn.onclick = function() {
          var p = prompt("Nhập mật khẩu quản trị:");
          if (p === "nhung2026") {
            localStorage.setItem("admin_unlocked", "true");
            alert("Mở khóa thành công! Trang web sẽ tải lại.");
            location.reload();
          } else if (p !== null) {
            alert("Sai mật khẩu!");
          }
        };
        document.body.appendChild(unlockBtn);
      }
    });
  })();
  </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
